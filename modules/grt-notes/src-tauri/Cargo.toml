[package]
name = "grt-notes"
version = "0.1.0"
description = "Local notebooks and notes, searchable across the whole archive"
authors = ["GRT Project"]
license = "MIT"
edition = "2021"

[lib]
name = "grt_notes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
percent-encoding = "2"

# The shared container, so a note is a .grt like every other document.
grt-container = { path = "../../../core/grt-container" }

# The search index (of GRT_NOTES_DATES.md).
rusqlite = { version = "0.32", features = ["bundled"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
