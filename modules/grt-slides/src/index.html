<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GRT Slides</title>
    <link rel="stylesheet" href="css/design.css" />
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <nav id="menubar" aria-label="Menus"></nav>
    <header class="toolbars">
      <div class="toolbar" id="toolbar-standard" role="toolbar" aria-label="Standard">
        <div class="group">
          <button id="btn-new" data-icon="new" title="New (Ctrl+N)">New</button>
          <button data-command="File/Templates/Manage Templates" data-icon="templates"></button>
          <button id="btn-open" data-icon="open" title="Open (Ctrl+O)">Open</button>
          <button id="btn-save" data-icon="save" title="Save (Ctrl+S)">Save</button>
          <button id="btn-save-as" data-icon="saveAs" title="Save As (Ctrl+Shift+S)">Save As</button>
        </div>
        <div class="group">
          <button id="btn-export" data-icon="export" title="Export">Export</button>
          <button id="btn-print" data-icon="print" title="Print (Ctrl+P)">Print</button>
        </div>
        <div class="group">
          <button data-command="Format/Clear Direct Formatting" data-icon="clear"></button>
        </div>
        <div class="group">
          <button id="btn-undo" data-icon="undo" title="Undo (Ctrl+Z)">Undo</button>
          <button id="btn-redo" data-icon="redo" title="Redo (Ctrl+Y)">Redo</button>
        </div>
        <div class="group">
          <button data-command="Edit/Find and Replace…" data-icon="find"></button>
          <button data-command="Tools/Spelling…" data-icon="spelling"></button>
        </div>
        <div class="group">
          <button id="btn-add-text" data-icon="textBox" title="Insert Text Box (F2)">Insert Text Box</button>
          <button id="btn-add-image" data-icon="image" title="Insert Image">Insert Image</button>
          <button id="btn-add-shape" data-icon="shape" title="Insert Shape">Insert Shape</button>
          <button id="btn-add-table" data-icon="table" title="Insert Table">Insert Table</button>
          <button data-command="Insert/Chart…" data-icon="chart"></button>
          <button data-command="Insert/Special Character…" data-icon="special"></button>
          <button data-command="Insert/Hyperlink…" data-icon="link"></button>
          <button data-command="Insert/Comment" data-icon="comment"></button>
        </div>
        <div class="group">
          <button id="btn-present" data-icon="play" title="Start from First Slide (F5)">Start from First Slide</button>
          <button data-command="Slide Show/Start from Current Slide" data-icon="playCurrent"></button>
          <button id="btn-presenter" data-icon="presenter" title="Presenter view on a second screen">Presenter Console</button>
        </div>
        <div class="spacer"></div>
        <div class="group end">
          <button id="btn-commands" data-icon="commands" title="Search Commands (Ctrl+K)">Search Commands</button>
          <button id="btn-settings" data-icon="settings" title="Options (Ctrl+,)">Options</button>
        </div>
      </div>
      <div class="toolbar" id="toolbar-presentation" role="toolbar" aria-label="Presentation and Formatting">
        <div class="group">
          <button id="btn-add-slide" data-icon="newSlide" title="New Slide (Ctrl+M)">New Slide</button>
          <button id="btn-duplicate" data-icon="duplicate" title="Duplicate Slide">Duplicate Slide</button>
          <button id="btn-delete-slide" data-icon="deleteSlide" title="Delete Slide">Delete Slide</button>
          <button data-command="Slide/Layout…" data-icon="layout"></button>
          <button data-command="View/Master Slide" data-icon="master"></button>
        </div>
        <div class="group">
          <button id="btn-design" data-icon="design" title="Slide Design: colours, fonts and the look of the deck">Slide Design</button>
          <button id="btn-slide-setup" data-icon="slideSetup" title="Slide Properties: background and transition">Slide Properties</button>
        </div>
        <div class="group">
          <select id="style-picker" title="Style of the selected text" aria-label="Style">
            <option value="">Style…</option>
            <option value="title">Title</option>
            <option value="body">Body</option>
            <option value="caption">Caption</option>
          </select>
        </div>
        <div class="group">
          <button data-command="Format/Text/Bold" data-icon="bold"></button>
          <button data-command="Format/Text/Italic" data-icon="italic"></button>
          <button data-command="Format/Text/Single Underline" data-icon="underline" aria-label="Underline"></button>
          <button data-command="Format/Text/Strikethrough" data-icon="strike"></button>
          <button data-command="Format/Text/Shadow" data-icon="shadow"></button>
        </div>
        <div class="group">
          <button data-command="Format/Lists/Unordered List" data-icon="bullets"></button>
          <button data-command="Format/Lists/Ordered List" data-icon="numbers"></button>
          <button data-command="Format/Spacing/Increase Indent" data-icon="indentMore"></button>
          <button data-command="Format/Spacing/Decrease Indent" data-icon="indentLess"></button>
        </div>
        <div class="group">
          <button id="btn-front" data-icon="front" title="Bring to Front">Bring to Front</button>
          <button id="btn-back" data-icon="back" title="Send to Back">Send to Back</button>
          <button id="btn-delete" data-icon="delete" title="Delete (Del)">Delete</button>
        </div>
      </div>
    </header>

    <main id="workspace" class="workspace">
      <aside id="thumbnails" class="thumbnails" aria-label="Slides"></aside>
      <section id="stage" class="stage">
        <div id="master-banner" class="master-banner hidden">Editing the master <strong id="master-banner-name"></strong>: what is here shows under every slide that uses it. <button id="btn-master-done">Done</button></div>
        <div id="surface" class="surface"></div>
      </section>
      <aside id="notes-panel" class="notes">
        <div id="properties"></div>
        <label for="notes">Speaker notes</label>
        <textarea id="notes" placeholder="Visible in the presenter view, never on screen."></textarea>
      </aside>
    </main>
    <footer id="statusbar" aria-label="Status"></footer>

    <div id="present-root" class="present-root"></div>

    <div id="overlay" class="overlay hidden">
      <div class="panel" role="dialog" aria-modal="true">
        <h2 id="panel-title">Panel</h2>
        <div id="panel-body"></div>
        <div class="panel-actions">
          <button id="panel-cancel">Close</button>
          <button id="panel-confirm" class="primary hidden">OK</button>
        </div>
      </div>
    </div>

    <div id="toast" class="toast hidden"></div>
    <p id="ephemeral-note" class="ephemeral-note hidden">
      Ephemeral mode: nothing is written to disk except the document you save.
    </p>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
