[package]
name = "grt-tables"
version = "0.1.0"
description = "Local database with tables, relations, queries and forms"
authors = ["GRT Project"]
license = "MIT"
edition = "2021"

[lib]
name = "grt_tables_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
percent-encoding = "2"

# The container, for the readable .grt export that sits beside the .sqlite
# working file.
grt-container = { path = "../../../core/grt-container" }

# THE ENGINE. : this is the one module whose hard part is not written here.
rusqlite = { version = "0.32", features = ["bundled"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
