<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GRT Grid</title>
    <link rel="stylesheet" href="css/design.css" />
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <nav id="menubar" aria-label="Menus"></nav>
    <header class="toolbars">
      <div class="toolbar" id="toolbar-standard" role="toolbar" aria-label="Standard">
        <div class="group">
          <button id="btn-new" data-icon="new" title="New (Ctrl+N)">New</button>
          <button data-command="File/Templates/Manage Templates…" data-icon="templates"></button>
          <button id="btn-open" data-icon="open" title="Open (Ctrl+O)">Open</button>
          <button id="btn-save" data-icon="save" title="Save (Ctrl+S)">Save</button>
          <button data-command="File/Save As…" data-icon="saveAs"></button>
        </div>
        <div class="group">
          <button data-command="File/Export as/Export as PDF…" data-icon="pdf"></button>
          <button id="btn-print" data-icon="print" title="Print (Ctrl+P)">Print</button>
        </div>
        <div class="group">
          <button data-command="Format/Clone Formatting" data-icon="clone"></button>
          <button data-command="Format/Clear Direct Formatting" data-icon="clear"></button>
        </div>
        <div class="group">
          <button id="btn-undo" data-icon="undo" title="Undo (Ctrl+Z)">Undo</button>
          <button id="btn-redo" data-icon="redo" title="Redo (Ctrl+Y)">Redo</button>
        </div>
        <div class="group">
          <button data-command="Edit/Find and Replace…" data-icon="find"></button>
          <button data-command="Tools/Spelling…" data-icon="spelling"></button>
        </div>
        <div class="group">
          <button id="btn-insert-row" data-icon="insertRow" title="Insert Rows Above">Insert Rows Above</button>
          <button id="btn-insert-col" data-icon="insertCol" title="Insert Columns Before">Insert Columns Before</button>
          <button id="btn-delete-row" data-icon="deleteRow" title="Delete Rows">Delete Rows</button>
          <button id="btn-delete-col" data-icon="deleteCol" title="Delete Columns">Delete Columns</button>
        </div>
        <div class="group">
          <button id="btn-sort-up" data-icon="sortUp" title="Sort Ascending">Sort Ascending</button>
          <button id="btn-sort-down" data-icon="sortDown" title="Sort Descending">Sort Descending</button>
          <button id="btn-filter" data-icon="filter" title="AutoFilter (Ctrl+Shift+L)">AutoFilter</button>
        </div>
        <div class="group">
          <button id="btn-chart" data-icon="chart" title="Insert Chart">Insert Chart</button>
          <button data-command="Insert/Pivot Table…" data-icon="pivot"></button>
          <button data-command="Insert/Special Character…" data-icon="special"></button>
          <button data-command="Insert/Hyperlink…" data-icon="link"></button>
          <button data-command="Insert/Comment" data-icon="comment"></button>
        </div>
        <div class="group">
          <button data-command="View/Freeze Cells/Freeze Rows and Columns" data-icon="freeze"></button>
        </div>
        <span class="spacer"></span>
        <div class="group end">
          <button id="btn-import-csv" data-icon="importFile" title="Import CSV">Import CSV</button>
          <button id="btn-export-csv" data-icon="export" title="Export as CSV">Export as CSV</button>
          <button id="btn-settings" data-icon="settings" title="Options">Options</button>
        </div>
      </div>
      <div class="toolbar" id="toolbar-formatting" role="toolbar" aria-label="Formatting">
        <div class="group">
          <select id="style-picker" title="Cell Style" aria-label="Cell Style">
            <option value="normal">Normal</option>
          </select>
        </div>
        <div class="group" role="group" aria-label="Text">
          <button id="btn-bold" data-icon="bold" title="Bold (Ctrl+B)">Bold</button>
          <button id="btn-italic" data-icon="italic" title="Italic (Ctrl+I)">Italic</button>
          <button id="btn-underline" data-icon="underline" title="Underline (Ctrl+U)">Underline</button>
        </div>
        <div class="group" role="group" aria-label="Alignment">
          <button id="btn-align-left" data-icon="alignLeft" title="Align Left">Align Left</button>
          <button id="btn-align-center" data-icon="alignCenter" title="Align Center">Align Center</button>
          <button id="btn-align-right" data-icon="alignRight" title="Align Right">Align Right</button>
          <button id="btn-wrap" data-icon="wrap" title="Wrap Text">Wrap Text</button>
          <button id="btn-merge" data-icon="merge" title="Merge and Center Cells">Merge and Center Cells</button>
          <button data-command="Format/Align Text/Top" data-icon="alignTop"></button>
          <button data-command="Format/Align Text/Center" data-icon="alignMiddle"></button>
          <button data-command="Format/Align Text/Bottom" data-icon="alignBottom"></button>
        </div>
        <div class="group" role="group" aria-label="Number format">
          <button id="btn-currency" data-icon="currency" title="Format as Currency (Ctrl+Shift+4)">Format as Currency</button>
          <button id="btn-percent" data-icon="percent" title="Format as Percent (Ctrl+Shift+5)">Format as Percent</button>
          <button data-command="Format/Number Format/General" data-icon="number" aria-label="Format as General"></button>
          <button data-command="Format/Number Format/Date" data-icon="date"></button>
          <button id="btn-sum" data-icon="sum" title="Sum (Alt+=)">Sum</button>
        </div>
        <div class="group">
          <button data-command="Format/Borders/All Borders" data-icon="borders"></button>
          <button data-command="Format/Conditional…" data-icon="conditional"></button>
        </div>
      </div>
    </header>

    <div class="formula-bar">
      <span id="name-box" class="name-box">A1</span>
      <input id="formula-input" class="formula-input" spellcheck="false"
             placeholder="Type a value, or a formula beginning with =" />
      <span id="cell-help" class="cell-help"></span>
    </div>

    <main>
      <div id="grid" class="grid">
        <div class="grid-corner"></div>
        <div class="grid-column-header"></div>
        <div class="grid-row-header"></div>
        <div class="grid-body"></div>
      </div>
      <aside id="properties"></aside>
    </main>

    <footer class="sheet-tabs-bar">
      <span id="sheet-tabs" class="sheet-tabs"></span>
      <button id="btn-add-sheet" class="add-sheet" title="Insert Sheet">+</button>
    </footer>
    <footer id="statusbar" class="statusbar" aria-label="Status">
      <span id="sheet-count" class="status-field" title="The sheet in front of you"></span>
      <span class="status-field" title="Page Style">Default Page Style</span>
      <span id="status-language" class="status-field" title="Language"></span>
      <span class="status-field grow"></span>
      <span id="ephemeral" class="status-field badge hidden">Ephemeral</span>
      <span id="summary" class="status-field summary" title="Sum, average and count of the selected cells"></span>
      <button id="zoom-out" class="status-field" type="button" title="Zoom Out">−</button>
      <button id="zoom-label" class="status-field" type="button" title="Zoom &amp; View Layout">100%</button>
      <button id="zoom-in" class="status-field" type="button" title="Zoom In">+</button>
      <span class="status-field">GRT Grid <span id="version"></span></span>
    </footer>

    <div id="overlay" class="overlay hidden">
      <div class="panel">
        <h2 id="panel-title"></h2>
        <div id="panel-body"></div>
        <div class="panel-actions">
          <button id="panel-cancel">Cancel</button>
          <button id="panel-confirm" class="primary">OK</button>
        </div>
      </div>
    </div>

    <div id="toast" class="toast hidden" role="status"></div>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
