[package]
name = "grt-grid"
version = "0.1.0"
description = "Local spreadsheet with formulas, recalculation and charts"
authors = ["GRT Project"]
license = "MIT"
edition = "2021"

[lib]
name = "grt_grid_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
percent-encoding = "2"

# The shared container.
grt-container = { path = "../../../core/grt-container" }

# No scripting engine, and there never will be one.

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
