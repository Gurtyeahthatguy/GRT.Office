[package]
name = "grt-paper"
version = "0.1.0"
description = "Local word processor with pagination and PDF export"
authors = ["GRT Project"]
license = "MIT"
edition = "2021"

[lib]
name = "grt_paper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
percent-encoding = "2"

# The shared core.
grt-container = { path = "../../../core/grt-container" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
