[package]
name = "grt-container"
version = "0.1.0"
description = "Deterministic reader and writer for the .grt document container"
authors = ["GRT Project"]
license = "MIT"
edition = "2021"

[lib]
# rlib for now: linked into each module rather than shipped as a shared
# object.
crate-type = ["rlib"]

[dependencies]
aes = "0.8"
aes-gcm = "0.10"
argon2 = "0.5"
base64 = "0.22"
blowfish = "0.9"
cbc = "0.1"
cfb = "0.10"
cfb-mode = "0.8"
flate2 = "1"
getrandom = "0.2"
hmac = "0.12"
md-5 = "0.10"
pbkdf2 = "0.12"
sha1 = "0.10"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
